<!DOCTYPE html>
<html lang="es">
<head link rel="icon" type="image/png" href="/favicon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OFFSTANDARD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @property --c1{syntax:'<color>';inherits:true;initial-value:#f3f4f6}
  @property --c2{syntax:'<color>';inherits:true;initial-value:#cdd2da}
  @property --c3{syntax:'<color>';inherits:true;initial-value:#e2e6ec}
  :root{--ink:#12121a}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{height:100dvh;overflow:hidden;overscroll-behavior:none;color:var(--ink);font-family:'Manrope',system-ui,sans-serif;-webkit-tap-highlight-color:transparent;
    background:linear-gradient(165deg,var(--c1),var(--c2));transition:--c1 .9s ease,--c2 .9s ease,--c3 .9s ease;
    display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top)}
  .disp{font-family:'Syne',system-ui,sans-serif}
  button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer;border:0;background:none;padding:0}
  :focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:16px}
  .orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.85;animation:drift 22s ease-in-out infinite alternate;pointer-events:none}
  .o1{width:55vmax;height:55vmax;left:-20vmax;top:-18vmax;background:var(--c3)}
  .o2{width:40vmax;height:40vmax;right:-12vmax;bottom:-10vmax;background:#fff;opacity:.7;animation-delay:-8s}
  .o3{width:34vmax;height:34vmax;right:10vw;top:-8vmax;background:var(--c2);animation-delay:-14s}
  .o4{width:44vmax;height:44vmax;left:-14vmax;bottom:-20vmax;background:#6f7888;opacity:.38;animation-delay:-4s}
  @keyframes drift{to{transform:translate(5vmax,4vmax) scale(1.12)}}
  header,#stage,.dock{position:relative;z-index:1}

  .glass{position:relative;background:linear-gradient(140deg,rgba(255,255,255,.6),rgba(255,255,255,.2) 55%,rgba(255,255,255,.38));
    -webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);border:1px solid rgba(255,255,255,.75);
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.35),inset 1px 0 0 rgba(255,255,255,.45),0 16px 38px -10px rgba(20,25,45,.38),0 2px 6px rgba(0,0,0,.05)}
  .glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:.4;transition:opacity .3s;
    background:radial-gradient(240px circle at var(--mx,25%) var(--my,0%),rgba(255,255,255,.75),transparent 62%)}
  .glass:hover::after{opacity:1}
  .dark{background:linear-gradient(#2d2d36,#0d0d12);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 8px 18px -6px rgba(0,0,0,.5)}

  header{display:grid;grid-template-columns:1fr auto;grid-template-areas:"brand bag" "seg seg";gap:10px;align-items:center;padding:12px 12px 0}
  .brand{grid-area:brand;justify-self:start;height:44px;padding:0 18px;border-radius:999px;display:flex;align-items:center;font-weight:800;font-size:14px;letter-spacing:.14em}
  #bag{grid-area:bag;position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;transition:transform .2s}
  #bag.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{40%{transform:scale(1.25)}}
  .badge{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;border-radius:10px;background:var(--ink);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
  .seg{grid-area:seg;justify-self:center;position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:4px;border-radius:999px;width:min(100%,330px)}
  .seg i{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);border-radius:999px;background:rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.12);
    transform:translateX(calc(var(--k,0)*100%));transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
  .seg button{position:relative;z-index:1;height:38px;font-weight:600;font-size:13.5px}

  #stage{position:relative;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none;min-height:0}
  #bgtxt{position:absolute;left:50%;top:40%;translate:-50% -50%;font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(64px,20vw,300px);letter-spacing:-.045em;white-space:nowrap;color:rgba(255,255,255,.7);pointer-events:none}
  .lens{position:absolute;left:50%;top:42%;translate:-50% -50%;width:min(74vw,46dvh);height:min(74vw,46dvh);border-radius:50%;animation:float 9s ease-in-out infinite}
  .bub{position:absolute;border-radius:50%;animation:float 7s ease-in-out infinite}
  .b1{width:13vmin;height:13vmin;top:12%;right:10%;animation-delay:-2s}.b2{width:8vmin;height:8vmin;bottom:34%;left:9%;animation-delay:-5s}
  @keyframes float{50%{transform:translateY(-12px)}}
  #prod{position:absolute;left:0;right:0;top:1%;height:90%;display:flex;justify-content:center;cursor:grab}
  #prod:active{cursor:grabbing}
  #bob{height:100%;animation:bob 6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-10px) rotate(.6deg)}}
  #pimg{display:block;height:100%;width:auto;max-width:92vw;object-fit:contain;pointer-events:none;filter:drop-shadow(0 28px 22px rgba(20,20,60,.38))}
  .flipbtn{position:absolute;top:6px;right:12px;z-index:5;height:40px;padding:0 16px;border-radius:999px;font-weight:600;font-size:13px}
  .arrow{display:none;position:absolute;bottom:18px;z-index:5;width:52px;height:52px;border-radius:50%;place-items:center}

  .info{position:absolute;z-index:6;left:10px;right:10px;bottom:4px;border-radius:30px;padding:14px 16px 16px}
  .info .top{display:flex;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.18em}
  .info h2{font-family:'Syne',sans-serif;font-weight:800;font-size:21px;line-height:1.05;margin:6px 0 2px;letter-spacing:-.01em}
  .price{font-size:20px;font-weight:700}.price small{font-size:10px;opacity:.5;font-weight:500}
  .desc{display:none;font-size:14.5px;line-height:1.5;opacity:.72;margin:10px 0 0}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .size{min-width:42px;height:42px;border-radius:14px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.5);font-weight:600;font-size:14px;transition:all .2s}
  .size[aria-pressed="true"]{background:linear-gradient(#2d2d36,#0d0d12);color:#fff;border-color:transparent}
  #add{flex:1;min-width:130px;height:46px;border-radius:16px;font-weight:700;font-size:15px;transition:transform .15s,background .3s}
  #add:active{transform:scale(.96)}

  .dock{justify-self:center;margin:8px 0 max(14px,env(safe-area-inset-bottom));padding:8px;border-radius:32px;display:flex;gap:8px}
  .dt{position:relative;width:54px;height:62px;border-radius:21px;background:rgba(255,255,255,.4);padding:5px;transition:transform .45s cubic-bezier(.3,1.5,.5,1),background .3s}
  .dt img{width:100%;height:100%;object-fit:contain;pointer-events:none}
  .dt.on{transform:translateY(-9px) scale(1.14);background:rgba(255,255,255,.92);box-shadow:0 10px 18px -6px rgba(0,0,0,.3)}
  .fly{position:fixed;z-index:90;pointer-events:none;object-fit:contain;filter:drop-shadow(0 12px 10px rgba(0,0,0,.3))}

  @media(min-width:768px){
    header{grid-template-columns:1fr auto 1fr;grid-template-areas:"brand seg bag";padding:18px 28px 0}
    #bag{justify-self:end}
    .lens{width:min(46vw,62dvh);height:min(46vw,62dvh);top:48%}
    #bgtxt{font-size:clamp(100px,19vw,300px);top:46%}
    #prod{height:97%}
    .info{left:4vw;right:auto;width:350px;bottom:auto;top:50%;translate:0 -50%;padding:24px}
    .info h2{font-size:30px;margin-top:10px}.price{font-size:24px}.desc{display:block}
    .row{margin-top:16px}
    .arrow{display:grid}.arrow.l{right:calc(3vw + 64px)}.arrow.r{right:3vw}
    .flipbtn{top:auto;bottom:24px;right:calc(3vw + 140px)}
    .dt{width:64px;height:72px}.dt:hover{transform:translateY(-7px) scale(1.15)}
    .dt.on:hover{transform:translateY(-9px) scale(1.18)}
  }
  @media(prefers-reduced-motion:reduce){.orb,.lens,.bub,#bob{animation:none}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="orb o4"></div>

<header>
  <div class="brand glass disp">OFFSTANDARD</div>
  <button id="bag" class="glass" aria-label="Bolsa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg><span class="badge" id="cart" hidden>0</span></button>
  <div class="seg glass" id="seg" role="tablist" aria-label="Categorías"><i></i>
    <button role="tab" data-c="Todos">Todo</button><button role="tab" data-c="Sudaderas">Sudaderas</button><button role="tab" data-c="Playeras">Playeras</button>
  </div>
</header>

<main id="stage" aria-live="polite">
  <div id="bgtxt" aria-hidden="true"></div>
  <div class="lens glass" aria-hidden="true"></div><div class="bub b1 glass" aria-hidden="true"></div><div class="bub b2 glass" aria-hidden="true"></div>
  <div id="prod" tabindex="0" role="button" aria-label="Girar prenda"><div id="bob"><img id="pimg" alt=""></div></div>
  <button class="flipbtn glass" id="flip">Ver espalda ⟲</button>
  <button class="arrow l glass" id="prev" aria-label="Anterior"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="arrow r glass" id="next" aria-label="Siguiente"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>

  <section class="info glass" id="info">
    <div class="top"><span id="iBrand"></span><span id="iCount" style="opacity:.5"></span></div>
    <h2 id="iName"></h2>
    <div class="price"><span id="iPrice"></span> <small>MXN</small></div>
    <p class="desc" id="iDesc"></p>
    <div class="row"><div id="sizes" class="row" style="margin:0"></div><button id="add" class="dark">Añadir a la bolsa</button></div>
  </section>
</main>

<nav class="dock glass" id="dock" aria-label="Prendas"></nav>

const BRAND='TRUE RELIGION',SIZES=['S','M','L','XL'];
const P=[
 {k:'hoodie_azul', n:'Sudadera con parches · marino',  cat:'Sudaderas',p:1799,b:1,bg:'PARCHES',  th:['#f3f4f6', '#cdd2da', '#e2e6ec'],d:'Sudadera azul marino con cierre completo. Herradura bordada al frente y parches bordados en la espalda.'},
 {k:'hoodie_negro',n:'Sudadera herradura · negra',     cat:'Sudaderas',p:1699,b:1,bg:'HERRADURA',th:['#eef0f3', '#bfc5ce', '#d9dee5'],d:'Sudadera negra con cierre completo, herradura roja al frente y gráfico “True Est. 2002” en la espalda.'},
 {k:'tee_brand',   n:'Playera Brand Jeans · negra',    cat:'Playeras', p:899, b:0,bg:'BRAND',    th:['#f5f6f8', '#d6dae1', '#e8ebf0'],d:'Playera negra con bloque “True Religion Brand Jeans” al frente y herradura en la manga.'},
 {k:'tee_red',     n:'Playera World Tour · roja',      cat:'Playeras', p:849, b:1,bg:'TOUR',     th:['#eceff2', '#c3c9d2', '#dde1e7'],d:'Playera negra con herradura roja en el pecho y “Est. 2002 World Tour” en la espalda.'},
 {k:'tee_color',   n:'Playera World Tour · multicolor',cat:'Playeras', p:849, b:1,bg:'2002',     th:['#f2f3f6', '#c8ced8', '#e0e4ea'],d:'Playera negra con logo multicolor en el pecho y gráfico World Tour con ciudades en la espalda.'}
].map((x,i)=>({...x,i,code:'OS-'+String(i+1).padStart(3,'0'),size:'M'}));

const $=s=>document.querySelector(s),money=n=>'$'+n.toLocaleString('es-MX');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,D=n=>reduce?1:n,EASE='cubic-bezier(.22,1,.36,1)';
const prod=$('#prod'),img=$('#pimg'),bgtxt=$('#bgtxt'),info=$('#info');
const st={cat:'Todos',i:0,v:'f'};let busy=false;
const list=()=>P.filter(p=>st.cat==='Todos'||p.cat===st.cat);

function render(){
  const p=P[st.i],L=list(),pos=L.indexOf(p)+1;
  ['--c1','--c2','--c3'].forEach((v,j)=>document.body.style.setProperty(v,p.th[j]));
  bgtxt.textContent=p.bg;img.src=IMG[p.k+'_f'];img.alt=p.n;
  $('#iBrand').textContent=BRAND;$('#iCount').textContent=String(pos).padStart(2,'0')+' / '+String(L.length).padStart(2,'0');
  $('#iName').textContent=p.n;$('#iPrice').textContent=money(p.p);$('#iDesc').textContent=p.d;
  $('#sizes').innerHTML=SIZES.map(s=>`<button class="size" data-s="${s}" aria-pressed="${s===p.size}">${s}</button>`).join('');
  $('#add').textContent='Añadir a la bolsa';
  $('#flip').style.display=p.b?'':'none';$('#flip').textContent='Ver espalda ⟲';
  document.querySelectorAll('.dt').forEach(d=>d.classList.toggle('on',+d.dataset.i===st.i));
  const cs=['Todos','Sudaderas','Playeras'];$('#seg').style.setProperty('--k',cs.indexOf(st.cat));
  document.querySelectorAll('#seg button').forEach(b=>b.setAttribute('aria-selected',b.dataset.c===st.cat));
}
function renderDock(){$('#dock').innerHTML=list().map(p=>`<button class="dt" data-i="${p.i}" aria-label="${p.n}"><img src="${IMG[p.k+'_f']}" alt=""></button>`).join('');}

async function go(ti,dir){
  if(busy||ti===st.i)return;busy=true;
  const cur=prod.style.transform||'none';
  await Promise.all([
    prod.animate([{transform:cur,opacity:1},{transform:`translateX(${-dir*90}px) rotate(${-dir*6}deg)`,opacity:0}],{duration:D(240),easing:'ease-in',fill:'forwards'}).finished,
    bgtxt.animate([{transform:'none',opacity:1},{transform:`translateX(${-dir*60}px)`,opacity:0}],{duration:D(240),fill:'forwards'}).finished,
    info.animate([{opacity:1},{opacity:0}],{duration:D(200),fill:'forwards'}).finished]);
  st.i=ti;st.v='f';render();prod.style.transform='';bgtxt.style.transform='';
  [prod,bgtxt,info].forEach(e=>e.getAnimations().forEach(a=>a.cancel()));
  prod.animate([{transform:`translateX(${dir*90}px) rotate(${dir*6}deg)`,opacity:0},{transform:'none',opacity:1}],{duration:D(560),easing:EASE});
  bgtxt.animate([{transform:`translateX(${dir*60}px)`,opacity:0},{transform:'none',opacity:1}],{duration:D(700),easing:EASE});
  info.animate([{opacity:0},{opacity:1}],{duration:D(450),easing:'ease-out'});
  busy=false;
}
const step=d=>{const L=list(),j=(L.indexOf(P[st.i])+d+L.length)%L.length;go(L[j].i,d)};

async function flip(){
  const p=P[st.i];if(busy)return;
  if(!p.b){prod.animate([{transform:'none'},{transform:'rotate(-2.5deg)'},{transform:'rotate(2.5deg)'},{transform:'none'}],{duration:D(420)});return;}
  busy=true;const nv=st.v==='f'?'b':'f',rot=a=>`perspective(900px) rotateY(${a}deg)`;
  await img.animate([{transform:rot(0)},{transform:rot(90)}],{duration:D(200),easing:'ease-in',fill:'forwards'}).finished;
  st.v=nv;img.src=IMG[p.k+'_'+nv];img.getAnimations().forEach(a=>a.cancel());
  $('#flip').textContent=nv==='f'?'Ver espalda ⟲':'Ver frente ⟲';
  img.animate([{transform:rot(-90)},{transform:rot(0)}],{duration:D(340),easing:'ease-out'});busy=false;
}

/* Deslizar para cambiar · tocar para girar */
let sx=null,dx=0,drag=false;
$('#stage').addEventListener('pointerdown',e=>{if(busy||e.target.closest('button,.info'))return;sx=e.clientX;dx=0;drag=false;$('#stage').setPointerCapture(e.pointerId);});
$('#stage').addEventListener('pointermove',e=>{if(sx===null)return;dx=e.clientX-sx;if(Math.abs(dx)>8)drag=true;
  if(drag){prod.style.transform=`translateX(${dx*.55}px) rotate(${dx*.025}deg)`;bgtxt.style.transform=`translateX(${dx*.2}px)`;}});
const end=()=>{if(sx===null)return;sx=null;
  if(drag&&Math.abs(dx)>70){step(dx<0?1:-1);}
  else{const was=prod.style.transform;prod.style.transform='';bgtxt.style.transform='';
    if(drag&&was)prod.animate([{transform:was},{transform:'none'}],{duration:D(450),easing:'cubic-bezier(.3,1.5,.5,1)'});
    if(!drag)flip();}
  drag=false;};
$('#stage').addEventListener('pointerup',end);$('#stage').addEventListener('pointercancel',end);
prod.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}});
addEventListener('keydown',e=>{if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);});
$('#next').onclick=()=>step(1);$('#prev').onclick=()=>step(-1);$('#flip').onclick=flip;

$('#dock').addEventListener('click',e=>{const b=e.target.closest('.dt');if(!b)return;const t=+b.dataset.i,L=list();go(t,L.indexOf(P[t])>L.indexOf(P[st.i])?1:-1);});
$('#seg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;st.cat=b.dataset.c;renderDock();
  const L=list();if(L.includes(P[st.i]))render();else go(L[0].i,1);if(!L.includes(P[st.i]))setTimeout(()=>{},0);});
$('#sizes').addEventListener('click',e=>{const b=e.target.closest('.size');if(!b)return;P[st.i].size=b.dataset.s;
  document.querySelectorAll('.size').forEach(s=>s.setAttribute('aria-pressed',s===b));});

/* Añadir: la prenda vuela a la bolsa */
let cart=0;
$('#add').addEventListener('click',()=>{
  const r=img.getBoundingClientRect(),t=$('#bag').getBoundingClientRect(),f=document.createElement('img');
  f.className='fly';f.src=img.src;f.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;document.body.appendChild(f);
  const tx=t.left+t.width/2-(r.left+r.width/2),ty=t.top+t.height/2-(r.top+r.height/2);
  f.animate([{transform:'none',opacity:1},{transform:`translate(${tx*.5}px,${ty*.3-40}px) scale(.45) rotate(-8deg)`,opacity:.9,offset:.5},{transform:`translate(${tx}px,${ty}px) scale(.05)`,opacity:.2}],{duration:D(750),easing:'cubic-bezier(.5,0,.3,1)'}).finished.then(()=>{
    f.remove();cart++;const c=$('#cart');c.hidden=false;c.textContent=cart;const b=$('#bag');b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');});
  const a=$('#add');a.textContent='Añadido ✓';setTimeout(()=>{a.textContent='Añadir otra'},1400);
});
addEventListener('pointermove',e=>{const g=e.target.closest&&e.target.closest('.glass');if(!g)return;const r=g.getBoundingClientRect();
  g.style.setProperty('--mx',(e.clientX-r.left)+'px');g.style.setProperty('--my',(e.clientY-r.top)+'px');},{passive:true});

renderDock();render();
</script>
</body>
