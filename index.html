<style>
:root{--fg:#fff;--b0:#9b0f34;--b1:#5b0a1f;--ink:#111;--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#111;overflow-x:clip}
body{font-family:var(--sans);color:var(--fg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;color:var(--fg);transition:color .7s;overflow:hidden;isolation:isolate}
.bg{position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .9s ease}
.bg.on{opacity:1}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 55% at 50% 42%,rgba(255,255,255,.16),transparent 70%),linear-gradient(90deg,rgba(0,0,0,.14),transparent 25%,transparent 75%,rgba(0,0,0,.14))}
/* nav */
.nav{display:flex;align-items:center;gap:16px;padding:calc(14px + env(safe-area-inset-top)) 18px 6px;position:relative;z-index:5}
.nav .lg img{height:38px;display:block;filter:var(--logofx,none);transition:filter .7s}
.nav ul{display:none;list-style:none;gap:6px;margin:0 auto}
.nav li button{padding:7px 14px;border-radius:8px;font-size:14px;opacity:.78;transition:.2s}
.nav li button:hover{opacity:1}
.nav li button.on{opacity:1;background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.light .nav li button.on{background:rgba(0,0,0,.1);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.nav .sp{flex:1}
.bagb{position:relative;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14)}
.light .bagb{background:rgba(0,0,0,.08)}
.bagb svg{width:20px;height:20px}
.bagb i{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:#ff2d55;color:#fff;font:700 11px/18px var(--sans);text-align:center;font-style:normal;padding:0 4px}
.bagb i:empty{display:none}
/* layout */
.main{flex:1;display:grid;grid-template-columns:1fr;grid-template-rows:auto auto auto;align-content:start;gap:0;padding:6px 20px 0;position:relative;z-index:2}
.copy{text-align:center;transition:opacity .35s,transform .35s}
.copy h1{font:500 clamp(30px,9vw,44px)/1.05 var(--serif);letter-spacing:.2px}
.copy p{display:none;font-size:14px;line-height:1.55;max-width:300px;margin-top:14px;opacity:.9}
.cta{display:inline-flex;align-items:center;gap:8px;margin-top:0;background:#fff;color:#111;border-radius:999px;padding:13px 22px;font:600 14px var(--sans);box-shadow:0 8px 22px rgba(0,0,0,.25);transition:transform .2s}
.cta:active{transform:scale(.96)}
.cta svg{width:15px;height:15px}
.cta.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.stage{position:relative;height:calc(var(--B) * 1.2);margin:12px auto 0;width:100%;display:grid;place-items:center;touch-action:pan-y}
:root{--B:min(40svh,76vw)}
.slot{position:absolute;left:50%;top:calc(var(--B) * .2);translate:-50% 0;will-change:transform,opacity}
.hg{position:relative;isolation:isolate;transform-origin:var(--ox) -6%;animation:sway 7s ease-in-out infinite}
.hg img{display:block;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 22px 26px rgba(0,0,0,.35));pointer-events:none;-webkit-user-drag:none;user-select:none}
.wire{position:absolute;z-index:2;left:var(--ox);top:0;height:calc(var(--H) * .11);width:auto;aspect-ratio:36/30;overflow:visible;transform:translate(-36.1%,-100%);pointer-events:none}
@keyframes sway{0%,100%{rotate:-1.4deg}50%{rotate:1.4deg}}
.shadow{position:absolute;left:50%;bottom:calc(var(--B) * .02);width:calc(var(--B) * .8);height:calc(var(--B) * .09);translate:-50% 0;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.42),transparent);filter:blur(5px);pointer-events:none}
.flipb{position:absolute;left:50%;bottom:-4px;translate:-50% 0;z-index:3;display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:7px 13px;border-radius:999px;background:rgba(0,0,0,.28);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff}
.flipb svg{width:14px;height:14px}
.side{text-align:center;transition:opacity .35s,transform .35s;margin-top:14px}
.side .nm{font-size:13px;opacity:.85;line-height:1.35;max-width:320px;margin:0 auto}
.side .pr{font:700 clamp(30px,8vw,38px)/1.1 var(--sans);margin:4px 0 10px;letter-spacing:-.5px}
.side .pr small{font-size:.38em;font-weight:600;opacity:.75;margin-left:4px;letter-spacing:0}
.sz{font-size:12px;opacity:.85;margin-bottom:8px}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.chip{width:46px;height:46px;border-radius:50%;font:600 13px var(--sans);box-shadow:inset 0 0 0 1.5px var(--fg);transition:.2s}
.chip.on{background:var(--fg);color:var(--bs)}
.acts{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.ctl{position:relative;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:14px 20px calc(16px + env(safe-area-inset-bottom));gap:12px;margin-top:auto}
.arw{position:absolute;left:0;right:0;top:50%;translate:0 -50%;display:flex;justify-content:space-between;padding:0 2px;pointer-events:none;z-index:5}
.ar{pointer-events:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--fg);background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),0 8px 22px rgba(0,0,0,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .2s,background .2s}
.light .ar{background:rgba(255,255,255,.5);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 8px 22px rgba(0,0,0,.12)}
.ar:hover{background:rgba(255,255,255,.26)}.light .ar:hover{background:rgba(255,255,255,.75)}
.ar:active{transform:scale(.9)}
.ar svg{width:20px;height:20px}
.ar:focus-visible{outline:2px solid currentColor;outline-offset:3px}
.thumbs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 2px;max-width:calc(100vw - 40px);margin:0 auto;align-items:flex-end}
.thumbs::-webkit-scrollbar{display:none}
.th{flex:none;width:42px;height:48px;border-radius:10px;display:grid;place-items:center;opacity:.55;transition:.25s;position:relative;background:rgba(255,255,255,.12)}
.th img{width:36px;height:42px;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.th.on{opacity:1;background:rgba(255,255,255,.28);transform:translateY(-3px)}
.tag,.soc{display:none}
.soc a{color:inherit}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.18);z-index:6}
.prog i{display:block;height:100%;width:100%;background:#fff;transform-origin:left;transform:scaleX(0)}
.pp{position:absolute;left:50%;top:50%;translate:-50% -50%;width:92px;height:92px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .25s;z-index:4;color:#fff}
.pp.show{opacity:1}
.pp svg{width:34px;height:34px}
/* bolsa */
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.on{display:block}
.sheet .sc{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet .pn{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:#141518;color:#fff;padding:20px;display:flex;flex-direction:column;gap:12px;animation:in .3s ease}
@keyframes in{from{transform:translateX(30px);opacity:0}}
.pn h2{font:500 28px var(--serif)}
.pn .ls{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px}
.it{display:flex;gap:12px;align-items:center;background:#1e2024;border-radius:14px;padding:10px}
.it img{width:54px;height:60px;object-fit:contain}
.it b{font-size:13px;font-weight:600;display:block}
.it span{font-size:12px;opacity:.7}
.it .x{margin-left:auto;font-size:20px;opacity:.7;padding:6px}
.pn .tt{display:flex;justify-content:space-between;font-weight:600}
.empty{opacity:.6;font-size:14px;padding:30px 0;text-align:center}
.close{align-self:flex-end;font-size:26px;line-height:1;padding:4px 8px}
@media(min-width:900px){
 .nav{padding:22px 48px 6px}.nav .lg img{height:46px}.nav ul{display:flex}
 .main{grid-template-columns:1fr 1.15fr 1fr;grid-template-rows:1fr;align-items:center;padding:0 56px;gap:10px}
 :root{--B:min(54svh,36vw)}
 .stage{grid-column:2;grid-row:1;margin:0;height:calc(var(--B) * 1.22)}
 .copy{grid-column:1;grid-row:1;text-align:left;align-self:center}
 .copy h1{font-size:clamp(38px,3.6vw,56px)}
 .copy p{display:block;max-width:330px}
 .cta{margin-top:26px}
 .side{grid-column:3;grid-row:1;text-align:right;align-self:center;margin:0}
 .side .nm{margin:0 0 8px auto;font-size:14px}
 .side .pr{font-size:clamp(36px,3.6vw,48px)}
 .chips{justify-content:flex-end}
 .acts{justify-content:flex-end}
 .copy .cta{display:inline-flex}
 .m-only{display:none!important}
 .tag{display:block;position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));translate:-50% 0;text-align:center;font:500 22px/1.25 var(--serif);opacity:.85;pointer-events:none}
 .soc{display:flex;gap:18px;position:relative;z-index:4;align-items:center}
 .soc a{opacity:.85;display:block}.soc a:hover{opacity:1}.soc svg{width:20px;height:20px;fill:currentColor}
 .thumbs{max-width:none;gap:10px}
 .th{width:52px;height:60px}.th img{width:44px;height:52px}
 .ctl{padding:10px 56px 22px;position:relative}
 .thumbs{margin:0}
 .arw{padding:0}
 .ar{width:52px;height:52px}.ar svg{width:22px;height:22px}
}
@media(min-width:900px) and (max-height:700px){:root{--B:min(46svh,34vw)}}
.d-only{display:none}@media(min-width:900px){.d-only{display:inline-flex}}
@media(prefers-reduced-motion:reduce){.hg{animation:none}}
</style>
</head>

 s.innerHTML=`<div class="hg" style="width:100%;height:100%"><img src="${IMG[p.k+'_'+v]}" alt="${p.n}"><svg class="wire" viewBox="-13 -30 36 30" aria-hidden="true"><defs><linearGradient id="cr" x1="0" x2="1"><stop offset="0" stop-color="#f4f5f7"/><stop offset=".5" stop-color="#a9adb5"/><stop offset="1" stop-color="#5d6068"/></linearGradient></defs><path d="M0 26V-10C0 -20 2 -26 8 -27C14 -28 17.5 -23 16 -17.5" fill="none" stroke="#000" stroke-width="4.2" stroke-linecap="round" transform="translate(.8 1)" opacity=".35"/><path d="M0 26V-10C0 -20 2 -26 8 -27C14 -28 17.5 -23 16 -17.5" fill="none" stroke="url(#cr)" stroke-width="3.4" stroke-linecap="round"/></svg></div>`;
 return s}
const bsolid=p=>p.l?'#111':p.b1;
function paintInfo(p,anim){
 const set=()=>{
  $('#nm').textContent=p.n+' · '+p.code;$('#pr').innerHTML=mx(p.p)+'<small>MXN</small>';
  hero.style.setProperty('--fg',p.l?'#14151a':'#fff');hero.style.setProperty('--bs',p.l?'#f3efe6':p.b1);
  hero.classList.toggle('light',!!p.l);
  document.documentElement.style.setProperty('--logofx',p.l?'invert(1)':'none');
  document.querySelector('meta[name=theme-color]').content=p.b1;
  $('#flipT').textContent=view==='f'?'Ver espalda':'Ver frente';
  chips();thumbs();
  $('#copy').style.opacity=$('#side').style.opacity=1;$('#copy').style.transform=$('#side').style.transform='none'};
 if(!anim){set();return}
 [$('#copy'),$('#side')].forEach(e=>{e.style.opacity=0;e.style.transform='translateY(8px)'});
 setTimeout(set,320)}
function chips(){$('#chips').innerHTML=SIZES.map(s=>`<button class="chip${s===size?' on':''}" data-s="${s}">${s}</button>`).join('')}
function thumbs(){$('#thumbs').innerHTML=list.map((p,i)=>`<button class="th${i===idx?' on':''}" data-i="${i}" aria-label="${p.n}"><img src="${IMG[p.k+'_f']}" alt=""></button>`).join('');
 const a=$('#thumbs .on');if(a&&$('#thumbs').scrollWidth>$('#thumbs').clientWidth)$('#thumbs').scrollTo({left:a.offsetLeft-$('#thumbs').clientWidth/2+24,behavior:'smooth'})}
function prog(){return;const b=$('#prog');b.getAnimations().forEach(a=>a.cancel());if(!auto||document.hidden)return;
 const a=b.animate([{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:5000,easing:'linear',fill:'forwards'});a.onfinish=()=>go(idx+1,1)}
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function go(n,dir=1,keepView){
 if(busy||!list.length)return;n=(n+list.length)%list.length;if(n===idx&&stage.querySelector('.slot'))return;
 busy=true;const old=stage.querySelector('.slot'),p=list[n];idx=n;if(!keepView)view='f';
 const nb=bgs[1-bi];nb.style.background=grad(p);nb.classList.add('on');bgs[bi].classList.remove('on');bi=1-bi;
 const el=mk(p,view);stage.appendChild(el);
 const D=reduce?1:780;
 if(old){old.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dir*34}vw,-70vh) rotate(${dir*14}deg)`,opacity:0}],{duration:D,easing:'cubic-bezier(.5,0,.9,.4)',fill:'forwards'}).onfinish=()=>old.remove()}
 el.animate([{transform:`translate(${-dir*8}vw,-80vh) rotate(${-dir*8}deg)`,opacity:0},{transform:'translate(0,6px) rotate(1.5deg)',opacity:1,offset:.78},{transform:'translate(0,0) rotate(0)',opacity:1}],{duration:reduce?1:1000,delay:old?(reduce?0:260):0,easing:'cubic-bezier(.2,.7,.3,1)',fill:'backwards'}).onfinish=()=>{busy=false;prog()};
 paintInfo(p,!!old);
 history.replaceState(null,'','#'+p.code.toLowerCase());
}
function flip(){const s=stage.querySelector('.slot');if(!s||busy)return;view=view==='f'?'b':'f';const p=cur(),img=s.querySelector('img'),hg=s.querySelector('.hg');
 $('#flipT').textContent=view==='f'?'Ver espalda':'Ver frente';
 hg.animate([{scale:'1 1'},{scale:'0 1'}],{duration:200,easing:'ease-in'}).onfinish=()=>{img.src=IMG[p.k+'_'+view];hg.animate([{scale:'0 1'},{scale:'1 1'}],{duration:240,easing:'ease-out'})}}
function setAuto(v,flash){auto=v;if(flash){const pp=$('#pp');pp.innerHTML=v?'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>':'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4.5" height="16" rx="1"/><rect x="13.5" y="4" width="4.5" height="16" rx="1"/></svg>';pp.classList.add('show');clearTimeout(pp._t);pp._t=setTimeout(()=>pp.classList.remove('show'),900)}
 if(!busy)prog()}
const wa=items=>{const t=items.reduce((a,i)=>a+i.p,0);return 'https://wa.me/'+WA+'?text='+encodeURIComponent('Hola OFF STANDARD, quiero pedir:\n'+items.map(i=>`• ${i.n} (${i.code}) — Talla ${i.s} — ${mx(i.p)}`).join('\n')+'\nTotal: '+mx(t)+' MXN')};
const bagUI=()=>{$('#bagN').textContent=cart.length||'';
 $('#ls').innerHTML=cart.length?cart.map((c,i)=>{const p=P.find(x=>x.code===c.code);return `<div class="it"><img src="${IMG[p.k+'_f']}" alt=""><div><b>${p.n}</b><span>${c.code} · Talla ${c.s} · ${mx(p.p)}</span></div><button class="x" data-r="${i}" aria-label="Quitar">×</button></div>`}).join(''):'<div class="empty">Tu bolsa está vacía</div>';
 $('#tot').textContent=mx(cart.reduce((a,c)=>a+P.find(x=>x.code===c.code).p,0));$('#send').style.display=cart.length?'':'none'};
/* eventos */
document.addEventListener('click',e=>{const t=e.target;
 let b;
 if(b=t.closest('[data-buy]')){const p=cur();open(wa([{n:p.n,code:p.code,s:size,p:p.p}]),'_blank','noopener');return}
 if(b=t.closest('.chip')){size=b.dataset.s;chips();return}
 if(b=t.closest('.th')){go(+b.dataset.i,+b.dataset.i>=idx?1:-1);return}
 if(t.closest('#nx')){go(idx+1,1);return}if(t.closest('#pv')){go(idx-1,-1);return}
 if(t.closest('#flip')){flip();return}
 if(t.closest('#add')){const p=cur();cart.push({code:p.code,s:size});save();bagUI();const a=$('#add');a.textContent='Añadido ✓';setTimeout(()=>a.textContent='Añadir a la bolsa',1100);return}
 if(t.closest('#bagBtn')){$('#sheet').classList.add('on');return}
 if(t.closest('#sc')||t.closest('#cl')){$('#sheet').classList.remove('on');return}
 if(b=t.closest('[data-r]')){cart.splice(+b.dataset.r,1);save();bagUI();return}
 if(t.closest('#send')){open(wa(cart.map(c=>{const p=P.find(x=>x.code===c.code);return{n:p.n,code:p.code,s:c.s,p:p.p}})),'_blank','noopener');return}
 if(b=t.closest('#menu button')){const c=b.dataset.c;if(c==='c'){open('https://wa.me/'+WA,'_blank','noopener');return}
  document.querySelectorAll('#menu button').forEach(x=>x.classList.toggle('on',x===b));
  list=c==='all'?P.slice():P.filter(p=>p.c===c);idx=-1;stage.querySelectorAll('.slot').forEach(s=>s.remove());busy=false;go(0,1);return}
 if(t.closest('#stage')&&!t.closest('#flip')){flip()}
});
let sx=null;stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
stage.addEventListener('touchend',e=>{if(sx==null)return;const d=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(d)>50){go(idx+(d<0?1:-1),d<0?1:-1)}});
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(idx+1,1);if(e.key==='ArrowLeft')go(idx-1,-1);});

/* inicio */
const h=(location.hash||'').slice(1).toUpperCase(),i0=P.findIndex(p=>p.code===h);
bagUI();idx=-1;go(i0>=0?i0:0,1);
</script>
